<!DOCTYPE html>

  <!-- Tailwind CSS via Play CDN -->

          <a href="#/dashboard" class="flex items-center gap-2 text-lg font-bold text-primary-600 hover:text-primary-700 transition-colors" id="nav-logo">

    <!-- Initial loading state -->
    <div id="loading-splash" class="flex items-center justify-center min-h-[60vh]">

        <div class="w-10 h-10 border-4 border-primary-200 border-t-primary-600 rounded-full animate-spin"></div>
        <p class="text-sm text-gray-500">Loading...</p>

  <script src="/js/router.js"></script>
  <script src="/js/views/login.js"></script>
